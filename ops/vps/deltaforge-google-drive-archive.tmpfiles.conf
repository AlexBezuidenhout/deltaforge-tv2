# Keep the unprivileged uploader's atomic writes inside its private state
# directory while preserving the canonical receipt paths consumed by health,
# partition and retention jobs.
d /var/lib/deltaforge/google-drive-archive 0700 deltaforge deltaforge -
d /var/lib/deltaforge/google-drive-archive/receipts 0700 deltaforge deltaforge -
L /var/lib/deltaforge/offhost-archive.receipt - - - - /var/lib/deltaforge/google-drive-archive/receipts/offhost-archive.receipt
L /var/lib/deltaforge/offhost-snapshot.receipt - - - - /var/lib/deltaforge/google-drive-archive/receipts/offhost-snapshot.receipt
